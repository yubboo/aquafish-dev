# Aquafish 容器镜像自动发布工作流。
#
# 发布通道：
#
# 1. main 分支开发测试镜像
#    ghcr.io/yubboo/aquafish-dev:main
#    ghcr.io/yubboo/aquafish-dev:sha-xxxxxxx
#
# 2. GitHub Release 社区正式镜像
#    ghcr.io/yubboo/aquafish:<版本>
#    aqhub/aquafish:<版本>
#
# 3. 专业版暂不在此工作流发布
#    aqhub/aquafish-pro 后续使用独立构建流程。

name: Publish container images

on:
  # main 分支代码变化时发布开发测试镜像。
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"

  # 点击 GitHub Release 的 Publish release 后，
  # 发布社区正式镜像。
  release:
    types:
      - published

  # 允许在 GitHub Actions 页面手动运行。
  workflow_dispatch:

# 同一分支或同一 Release 只保留最新任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # 拉取仓库源码。
  contents: read

  # 推送 GitHub GHCR 镜像。
  packages: write

env:
  # GitHub Container Registry 地址。
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish amd64 and arm64 images
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 拉取源码
      # ======================================================
      - name: Check out repository
        uses: actions/checkout@v6

      # ======================================================
      # 自动确定当前 Aquafish 版本
      #
      # Release：
      # v0.0.3 → 0.0.3
      #
      # main / 手动运行：
      # 自动选择 packaging/1panel/aquafish 下最高版本目录。
      # ======================================================
      - name: Resolve Aquafish version
        id: aquafish-version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(
              find packaging/1panel/aquafish \
                -mindepth 1 \
                -maxdepth 1 \
                -type d \
                -printf '%f\n' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          fi

          if [ -z "$VERSION" ]; then
            echo "Unable to resolve Aquafish version."
            exit 1
          fi

          VERSION_ROOT="packaging/1panel/aquafish/$VERSION"
          COMPOSE_FILE="$VERSION_ROOT/docker-compose.yml"
          DATA_FILE="$VERSION_ROOT/data.yml"

          if [ ! -d "$VERSION_ROOT" ]; then
            echo "Missing 1Panel version directory: $VERSION_ROOT"
            exit 1
          fi

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Missing 1Panel compose file: $COMPOSE_FILE"
            exit 1
          fi

          if [ ! -f "$DATA_FILE" ]; then
            echo "Missing 1Panel data file: $DATA_FILE"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Aquafish version: $VERSION"

      # ======================================================
      # 正式 Release 校验
      # ======================================================
      - name: Validate release
        if: github.event_name == 'release'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          AQUAFISH_VERSION: ${{ steps.aquafish-version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v<major>.<minor>.<patch>: $RELEASE_TAG"
            exit 1
          fi

          COMPOSE_FILE="packaging/1panel/aquafish/$AQUAFISH_VERSION/docker-compose.yml"
          EXPECTED_IMAGE="aqhub/aquafish:$AQUAFISH_VERSION"

          if ! grep -Fq "image: $EXPECTED_IMAGE" "$COMPOSE_FILE"; then
            echo "The 1Panel compose image must be:"
            echo "image: $EXPECTED_IMAGE"
            echo ""
            echo "Current compose file:"
            cat "$COMPOSE_FILE"
            exit 1
          fi

          echo "Release validation passed: $RELEASE_TAG"
          echo "1Panel image validation passed: $EXPECTED_IMAGE"

      # ======================================================
      # 多架构构建环境
      # ======================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================================
      # 登录 GitHub Container Registry
      #
      # GITHUB_TOKEN 由 GitHub 自动生成，
      # 不需要手动配置。
      # ======================================================
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================
      # 登录 Docker Hub
      #
      # 仅正式 Release 需要登录 Docker Hub。
      #
      # AQUAFISH_HUB：
      # GitHub Actions Secrets 中保存的 Docker Hub Token。
      # ======================================================
      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: aqhub
          password: ${{ secrets.AQUAFISH_HUB }}

      # ======================================================
      # 生成镜像名称与标签
      #
      # main：
      # ghcr.io/yubboo/aquafish-dev:main
      # ghcr.io/yubboo/aquafish-dev:sha-xxxxxxx
      #
      # Release v0.0.3：
      # ghcr.io/yubboo/aquafish:0.0.3
      # aqhub/aquafish:0.0.3
      # aqhub/aquafish:0.0
      # aqhub/aquafish:0
      # aqhub/aquafish:latest
      # ======================================================
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event_name == 'release' && 'aquafish' || 'aquafish-dev' }}
            name=aqhub/aquafish,enable=${{ github.event_name == 'release' }}

          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=sha,enable=${{ github.event_name == 'push' }}

            type=raw,value=main,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

          # latest 完全由上面的规则控制。
          flavor: |
            latest=false

      # ======================================================
      # 构建并推送镜像
      #
      # Dockerfile 会复制全部 1Panel 版本目录，
      # 因此不再需要向 Dockerfile 传入固定版本参数。
      # ======================================================
      - name: Build and publish images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          # 支持普通服务器和 ARM64 服务器。
          platforms: linux/amd64,linux/arm64

          # 构建后推送到镜像仓库。
          push: true

          # metadata-action 生成的标签。
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          # GitHub Actions 构建缓存。
          cache-from: type=gha
          cache-to: type=gha,mode=max

          # 镜像来源证明。
          provenance: mode=max

          # 软件物料清单。
          sbom: true