services:
  aquafish:
    image: aqhub/aquafish:0.0.3
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    volumes:
      - ./data:/app/workdir
    ports:
      - ${PANEL_APP_PORT_HTTP}:8520
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8520/api/setup/status
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8
      AQUAFISH_SERVER_PORT: "8520"
      AQUAFISH_EXTERNAL_URL: ${AQUAFISH_EXTERNAL_URL}
      AQUAFISH_WORK_DIR: /app/workdir
      AQUAFISH_STORAGE_PATH: /app/workdir/storage
      AQUAFISH_DEPLOYMENT_TYPE: onepanel
      AQUAFISH_SETUP_DATABASE_SOURCE: environment
      AQUAFISH_SETUP_REDIS_SOURCE: environment
      AQUAFISH_DATABASE_TYPE: ${PANEL_DB_TYPE}
      AQUAFISH_DATABASE_HOST: ${PANEL_DB_HOST}
      AQUAFISH_DATABASE_PORT: ${PANEL_DB_PORT}
      AQUAFISH_DATABASE_NAME: ${PANEL_DB_NAME}
      AQUAFISH_DATABASE_USERNAME: ${PANEL_DB_USER}
      AQUAFISH_DATABASE_PASSWORD: ${PANEL_DB_USER_PASSWORD}
      AQUAFISH_TABLE_PREFIX: aq_
      AQUAFISH_REDIS_ENABLED: "false"
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true
