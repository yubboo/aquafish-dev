additionalProperties:
  formFields:
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: mysql
      envKey: PANEL_DB_TYPE
      labelZh: 数据库服务
      labelEn: Database service
      label:
        zh: 数据库服务
        en: Database service
      required: true
      type: apps
      values:
        - label: MySQL
          value: mysql
        - label: MariaDB
          value: mariadb
        - label: PostgreSQL
          value: postgresql
    - default: aquafish
      envKey: PANEL_DB_NAME
      labelZh: 数据库名
      labelEn: Database name
      label:
        zh: 数据库名
        en: Database name
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: aquafish
      envKey: PANEL_DB_USER
      labelZh: 数据库用户
      labelEn: Database username
      label:
        zh: 数据库用户
        en: Database username
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: ""
      envKey: PANEL_DB_USER_PASSWORD
      labelZh: 数据库密码
      labelEn: Database password
      label:
        zh: 数据库密码
        en: Database password
      random: true
      required: true
      type: password
    - default: http://localhost:8520
      edit: true
      envKey: AQUAFISH_EXTERNAL_URL
      labelZh: 外部访问地址
      labelEn: External URL
      label:
        zh: 外部访问地址
        en: External URL
      required: true
      rule: paramHttp
      type: text
    - default: 8520
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelZh: 端口
      labelEn: Port
      label:
        zh: 端口
        en: Port
      required: true
      rule: paramPort
      type: number
