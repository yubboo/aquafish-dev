<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::main})}">
<head>
  <title th:text="${'页面错误 - ' + (site != null ? site.name : 'Aquafish')}">页面错误 - Aquafish</title>
</head>
<body>
<main>
  <section class="af-error-page">
    <span class="af-error-code">404</span>
    <h1 th:text="${errorTitle != null ? errorTitle : '页面出现错误'}">页面出现错误</h1>
    <p th:text="${errorMessage != null ? errorMessage : '当前页面暂时无法访问，请稍后再试。'}">当前页面暂时无法访问，请稍后再试。</p>
    <div class="af-actions">
      <a class="af-button" href="/">返回首页</a>
      <a class="af-button is-secondary" href="/forum">浏览论坛</a>
    </div>
    <div data-hook="error.after"></div>
  </section>
</main>
</body>
</html>
