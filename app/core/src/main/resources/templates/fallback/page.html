<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title != null ? title : 'Aquafish'}">Aquafish</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6f7fb; color: #111827; }
    .page { max-width: 960px; margin: 80px auto; padding: 32px; background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(15, 23, 42, .08); }
    .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #eef2ff; color: #4f46e5; font-size: 13px; }
    h1 { margin: 20px 0 10px; font-size: 32px; }
    p { line-height: 1.8; color: #4b5563; }
  </style>
</head>
<body>
  <main class="page">
    <span class="tag">Core Fallback</span>
    <h1 th:text="${heading != null ? heading : 'Aquafish 核心兜底页面'}">Aquafish 核心兜底页面</h1>
    <p th:text="${message != null ? message : '当前主题模板缺失，系统已自动切换到核心兜底页面。'}">当前主题模板缺失，系统已自动切换到核心兜底页面。</p>
  </main>
</body>
</html>
